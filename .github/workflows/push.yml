name: Linting and Testing

on:
  push:
    branches-ignore:
      - main
      - dev
      - hotfix/**

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Run lint
        run: ./gradlew :android:learncast:lintRelease

      - name: Run ktlintCheck
        run: ./gradlew ktlintCommonMainSourceSetCheck ktlintAndroidMainSourceSetCheck

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint.html
          path: ./android/learncast/build/reports/lint-results-release.html

  host-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Run host tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Upload host test report
        uses: actions/upload-artifact@v4
        with:
          name: host_test_report
          path: ./shared/build/reports/tests/testAndroidHostTest/